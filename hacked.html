<!DOCTYPE html>
<html>
<head>
  <title>SYSTEM COMPROMISED</title>
  <style>
    body {
      background: #000;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      margin: 0;
      padding: 20px;
      overflow: hidden;
      height: 100vh;
    }
    .glitch {
      font-size: 72px;
      font-weight: bold;
      text-align: center;
      margin-top: 60px;
      text-shadow: 2px 0 red, -2px 0 cyan;
      animation: glitch 0.3s infinite;
    }
    @keyframes glitch {
      0%   { transform: translate(0); }
      20%  { transform: translate(-2px, 2px); }
      40%  { transform: translate(-2px, -2px); }
      60%  { transform: translate(2px, 2px); }
      80%  { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }
    .terminal {
      margin: 40px auto;
      max-width: 800px;
      font-size: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .blink::after {
      content: '_';
      animation: blink 1s infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    .warning {
      color: red;
      font-size: 24px;
      text-align: center;
      margin-top: 30px;
      animation: blink 0.8s infinite;
    }
    .matrix {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.15;
      z-index: -1;
    }
  </style>
</head>
<body>
  <canvas class="matrix" id="matrix"></canvas>
  <div class="glitch">⚠ SYSTEM HACKED ⚠</div>
  <div class="warning">!!! ACCESS GRANTED !!!</div>
  <div class="terminal" id="terminal"></div>

  <script>
    const lines = [
      "> Initializing intrusion protocol...",
      "> Bypassing firewall............ OK",
      "> Cracking root password........ OK",
      "> Uploading payload.dll......... OK",
      "> Exfiltrating cat memes........ OK",
      "> Stealing your wifi password... OK",
      "> Replacing all fonts with Comic Sans... OK",
      "> Setting wallpaper to Nicolas Cage... OK",
      "> Just kidding! This is a prank :)",
      "> No systems were harmed in the making of this page.",
      "> Educational demo by Hassan 🐳",
      ""
    ];

    const terminal = document.getElementById('terminal');
    let lineIdx = 0;
    let charIdx = 0;
    let current = document.createElement('div');
    terminal.appendChild(current);

    function type() {
      if (lineIdx >= lines.length) {
        current.classList.add('blink');
        return;
      }
      const line = lines[lineIdx];
      if (charIdx < line.length) {
        current.textContent += line[charIdx++];
        setTimeout(type, 25);
      } else {
        current = document.createElement('div');
        terminal.appendChild(current);
        lineIdx++;
        charIdx = 0;
        setTimeout(type, 300);
      }
    }
    type();

    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const chars = '01アイウエオカキクケコサシスセソタチツテト';
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0f0';
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 50);
  </script>
</body>
</html>
